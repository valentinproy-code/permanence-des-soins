<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organigramme d'orientation</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    main { max-width: none; }
    .schema { overflow-x: auto; padding: 16px; background: #fff; border-radius: var(--rayon); border: 1px solid var(--bordure); }
    .legende { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .9rem; margin: 12px 0; }
    .legende span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
  </style>
</head>
<body>
  <header class="entete">
    <h1>Organigramme d'orientation</h1>
    <p class="sous-titre">Généré automatiquement à partir de l'arbre de décision — <a href="index.html">retour à l'outil</a></p>
    <div class="legende">
      <span style="--c:#c62828">Urgence / 15</span>
      <span style="--c:#c25e00">À voir rapidement</span>
      <span style="--c:#2e7d32">Rendez-vous programmé</span>
      <span style="--c:#1d5fa8">Information</span>
      <span style="--c:#7b61c9">Aiguillage selon l'heure</span>
    </div>
  </header>
  <main>
    <div class="schema"><pre class="mermaid" id="schema"></pre></div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/arbre.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    (function () {
      const arbre = window.construireArbre(window.CABINET);
      const CRENEAUX = { ouvert: "cabinet ouvert", ferme: "cabinet fermé", pdsa: "garde (PDSA)", nuit: "nuit 0h-8h" };
      const texte = (s, max = 60) => {
        const t = String(s).replace(/<[^>]+>/g, "").replace(/"/g, "#quot;");
        return t.length > max ? t.slice(0, max - 1) + "…" : t;
      };
      const lignes = ["flowchart LR"];
      for (const [id, n] of Object.entries(arbre.noeuds)) {
        if (n.type === "question") lignes.push(`  ${id}["${texte(n.titre)}"]:::question`);
        else if (n.type === "aiguillage") lignes.push(`  ${id}{{"🕒 ${texte(n.titre)}"}}:::aiguillage`);
        else lignes.push(`  ${id}(["${texte(n.titre)}"]):::${n.niveau}`);
        for (const o of n.options || []) lignes.push(`  ${id} -->|"${texte(o.libelle, 40)}"| ${o.suivant}`);
        for (const [c, cible] of Object.entries(n.branches || {})) lignes.push(`  ${id} -.->|"${CRENEAUX[c]}"| ${cible}`);
      }
      lignes.push(
        "  classDef question fill:#e6f3f7,stroke:#0b6e8a,color:#1c2733",
        "  classDef aiguillage fill:#efeafb,stroke:#7b61c9,color:#1c2733",
        "  classDef rouge fill:#fdecec,stroke:#c62828,color:#7f1010,font-weight:bold",
        "  classDef orange fill:#fff3e5,stroke:#c25e00,color:#6b3400",
        "  classDef vert fill:#ebf6ec,stroke:#2e7d32,color:#1b4d1e",
        "  classDef bleu fill:#e9f1fb,stroke:#1d5fa8,color:#123b69"
      );
      document.getElementById("schema").textContent = lignes.join("\n");
      mermaid.initialize({ startOnLoad: true, theme: "default", flowchart: { useMaxWidth: false } });
    })();
  </script>
</body>
</html>
